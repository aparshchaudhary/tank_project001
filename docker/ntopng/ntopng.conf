# ==============================================================================
# ntopng High-Speed Network & Telemetry Latency Monitoring Configuration
# Project: TURRET CBPM (Condition-Based Predictive Maintenance)
# ==============================================================================

# Network capture interface (monitors bridge traffic on turret-net)
-i=eth0

# Internal HTTP web GUI port (mapped to host port 3001 in docker-compose)
-w=3000

# Redis connection string (<host>:<port>@<db_index>)
-r=redis:6379@0

# Local networks definition for throughput & edge sensor flow classification
-m=172.28.0.0/16,10.0.0.0/8,192.168.0.0/16,127.0.0.0/8

# Persistent data directory for historical flows, RTT, and timeseries
-d=/var/lib/ntopng

# Run in Community Mode (removes enterprise license prompts)
--community

# Resolve container DNS hostnames locally
--dns-mode=1

# Custom Layer-7 application protocols (identifies Turret CBPM Telemetry)
-p=/etc/ntopng/protos.txt

# Enable flow alerts and latency threshold monitoring
--disable-alerts=no

# Disable HTTP prefix for direct root URL access
--http-prefix=
